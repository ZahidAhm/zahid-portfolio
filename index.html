<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zahid Muhammad | Portfolio</title>
    
    <!-- Load React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Load Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Internal CSS -->
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.3);
            --accent-hover: #059669;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Typography */
        h1, h2, h3 { font-weight: 700; letter-spacing: -0.025em; }
        h1 { font-size: 3rem; line-height: 1.1; margin-bottom: 1rem; }
        h2 { font-size: 2.25rem; margin-bottom: 2rem; }
        h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        p { color: var(--text-muted); margin-bottom: 1rem; }
        
        .text-gradient {
            background: linear-gradient(to right, #34d399, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .text-accent { color: var(--accent); }

        /* Layout Utilities */
        .container { max-width: 1200px; margin: 0 auto; px: 1rem; }
        .section { padding: 6rem 1.5rem; position: relative; z-index: 10; }
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-center { justify-content: center; }
        .justify-between { justify-content: space-between; }
        .gap-4 { gap: 1rem; }
        .grid { display: grid; gap: 2rem; }
        .grid-2 { grid-template-columns: 1fr; }
        .grid-3 { grid-template-columns: 1fr; }
        .text-center { text-align: center; }
        .relative { position: relative; }

        /* Navigation */
        nav {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            padding: 1.5rem; transition: all 0.3s ease;
        }
        nav.scrolled {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        .nav-content {
            max-width: 1200px; margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-weight: 800; color: white; text-decoration: none; }
        .nav-links { display: none; gap: 2rem; }
        .nav-links a {
            color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 0.9rem;
            text-transform: uppercase; letter-spacing: 1px; transition: color 0.2s;
        }
        .nav-links a:hover { color: var(--accent); }

        /* Buttons */
        .btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem 2rem; border-radius: 9999px;
            font-weight: 600; text-decoration: none; transition: all 0.3s ease;
            cursor: pointer; border: none; font-size: 1rem;
        }
        .btn-primary {
            background-color: var(--accent); color: #fff;
            box-shadow: 0 4px 14px 0 rgba(16, 185, 129, 0.39);
        }
        .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        .btn-secondary {
            background-color: var(--bg-card); color: #fff; border: 1px solid var(--border);
        }
        .btn-secondary:hover { border-color: var(--accent); }

        /* Cards */
        .card {
            background-color: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 1rem; padding: 1.5rem;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateY(-4px);
        }

        /* Project Card Specifics */
        .project-card { padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%; }
        .project-img {
            height: 12rem; background: linear-gradient(135deg, #1e293b, #334155);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        .project-content { padding: 1.5rem; flex-grow: 1; display: flex; flex-direction: column; }
        .tag {
            display: inline-block; font-size: 0.75rem; padding: 0.25rem 0.5rem;
            background: #0f172a; border: 1px solid var(--border); border-radius: 0.25rem;
            margin-right: 0.5rem; margin-top: 0.5rem; color: var(--text-muted);
        }

        /* Skill Bar */
        .skill-track { height: 0.5rem; background-color: #334155; border-radius: 9999px; overflow: hidden; margin-top: 0.5rem; }
        .skill-fill { height: 100%; background: linear-gradient(to right, #10b981, #22d3ee); border-radius: 9999px; }

        /* Timeline */
        .timeline-item {
            position: relative; padding-left: 2rem; padding-bottom: 3rem;
            border-left: 2px solid var(--border); margin-left: 1rem;
        }
        .timeline-item:last-child { border-left: 2px solid transparent; }
        .timeline-dot {
            position: absolute; left: -0.6rem; top: 0; width: 1rem; height: 1rem;
            background: var(--bg-card); border: 3px solid var(--bg-dark);
            border-radius: 50%; box-shadow: 0 0 0 2px var(--accent);
        }
        .timeline-date {
            font-family: monospace; color: var(--accent); font-size: 0.9rem; margin-bottom: 0.5rem; display: block;
        }

        /* Mobile Menu */
        .mobile-menu-btn { display: block; background: none; border: none; color: white; cursor: pointer; }
        .mobile-menu {
            display: none; position: absolute; top: 100%; left: 0; width: 100%;
            background: var(--bg-card); padding: 1rem; border-bottom: 1px solid var(--border);
        }
        .mobile-menu.open { display: block; }
        .mobile-link { display: block; padding: 0.75rem 1rem; color: white; text-decoration: none; }

        /* Parallax Background */
        .parallax-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 0.2; }

        /* --- Animation Styles --- */
        .reveal-up {
            opacity: 0;
            transform: translateY(50px) scale(0.95);
            transition: all 1s cubic-bezier(0.17, 0.55, 0.55, 1);
            will-change: transform, opacity;
        }
        .reveal-up.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Responsive Breakpoints */
        @media (min-width: 768px) {
            .grid-2 { grid-template-columns: repeat(2, 1fr); }
            .grid-3 { grid-template-columns: repeat(3, 1fr); }
            .nav-links { display: flex; }
            .mobile-menu-btn { display: none; }
            h1 { font-size: 4.5rem; }
            .timeline-item { padding-left: 3rem; margin-left: 10rem; border-left: 2px solid var(--border); }
            .timeline-date { position: absolute; left: -11rem; width: 8rem; text-align: right; top: 0; }
            .timeline-dot { left: -0.6rem; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Icons ---
        const Icon = ({ name, size = 24, className = "" }) => {
            const style = { width: size, height: size };
            switch(name) {
                case 'code': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>;
                case 'terminal': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>;
                case 'layout': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>;
                case 'database': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;
                case 'mail': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>;
                case 'phone': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>;
                case 'map': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>;
                case 'menu': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
                case 'x': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
                case 'github': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>;
                case 'linkedin': return <svg style={style} className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"></path><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle></svg>;
                default: return null;
            }
        };

        // --- Data ---
        const PORTFOLIO_DATA = {
            name: "Zahid Muhammad",
            title: "Software Engineering Graduate",
            location: "Timergara, Pakistan",
            email: "zksumr@gmail.com",
            phone: "03499352167",
            summary: "Innovative professional with experience in developing a vision transformer model for diabetic retinopathy detection. Proficient in React.js and Python, with strong skills in front-end web development and technical documentation.",
            skills: [
                { name: "React.js", level: 90, icon: "code" },
                { name: "Python", level: 85, icon: "terminal" },
                { name: "JavaScript", level: 88, icon: "layout" },
                { name: "HTML/CSS", level: 95, icon: "layout" },
                { name: "Responsive Design", level: 90, icon: "layout" },
                { name: "Technical Docs", level: 80, icon: "database" },
            ],
            experience: [
                {
                    title: "Diabetic Retinopathy Detection",
                    role: "Final Year Project",
                    period: "FYP",
                    description: "Developed a Vision Transformer (ViT) model to enhance accuracy of diabetic retinopathy detection. Analyzed large datasets to evaluate model performance.",
                    tags: ["Python", "Deep Learning", "ViT"]
                },
                {
                    title: "Products Distribution System",
                    role: "Developer",
                    period: "Project",
                    description: "Developed a Product and Distribution Management System for a local stock distributor to streamline inventory tracking and sales management.",
                    tags: ["Database", "Management", "Web"]
                }
            ],
            education: [
                { school: "University Of Malakand", degree: "BS Software Engineering", year: "07/2024" },
                { school: "GDC Gulabad", degree: "FSC: Pre-Engineering", year: "07/2019" }
            ]
        };

        // --- Components ---

        const ParallaxBackground = ({ scrollY }) => (
            <div className="parallax-bg">
                <div className="orb" style={{ 
                    top: '10%', right: '10%', width: '300px', height: '300px', 
                    background: '#10b981', transform: `translateY(${scrollY * 0.2}px)` 
                }} />
                <div className="orb" style={{ 
                    top: '40%', left: '5%', width: '400px', height: '400px', 
                    background: '#3b82f6', transform: `translateY(${scrollY * 0.3}px)` 
                }} />
                <div className="orb" style={{ 
                    bottom: '10%', right: '20%', width: '250px', height: '250px', 
                    background: '#8b5cf6', transform: `translateY(${scrollY * 0.1}px)` 
                }} />
            </div>
        );

        const Nav = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <nav className={scrolled ? 'scrolled' : ''}>
                    <div className="nav-content">
                        <a href="#" className="logo">ZM<span className="text-accent">.</span></a>
                        <div className="nav-links">
                            {['About', 'Skills', 'Projects', 'Contact'].map(item => (
                                <a key={item} href={`#${item.toLowerCase()}`}>{item}</a>
                            ))}
                        </div>
                        <button className="mobile-menu-btn" onClick={() => setIsOpen(!isOpen)}>
                            <Icon name={isOpen ? 'x' : 'menu'} />
                        </button>
                    </div>
                    <div className={`mobile-menu ${isOpen ? 'open' : ''}`}>
                        {['About', 'Skills', 'Projects', 'Contact'].map(item => (
                            <a key={item} href={`#${item.toLowerCase()}`} className="mobile-link" onClick={() => setIsOpen(false)}>
                                {item}
                            </a>
                        ))}
                    </div>
                </nav>
            );
        };

        const Hero = () => (
            <section className="section" style={{ minHeight: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <div className="container text-center">
                     <div style={{ marginBottom: '2rem' }}>
                        {/* Placeholder for profile image */}
                        <img 
                            src="https://ui-avatars.com/api/?name=Zahid+Muhammad&background=10b981&color=fff&size=200&bold=true" 
                            alt="Zahid Muhammad" 
                            style={{ 
                                width: '200px', height: '200px', borderRadius: '50%', 
                                objectFit: 'cover', border: '4px solid #1e293b',
                                boxShadow: '0 0 0 2px #10b981, 0 0 40px rgba(16, 185, 129, 0.4)',
                                backgroundColor: '#1e293b'
                            }} 
                        />
                    </div>

                    <div style={{ 
                        display: 'inline-block', padding: '0.5rem 1rem', 
                        background: 'rgba(16, 185, 129, 0.1)', 
                        border: '1px solid rgba(16, 185, 129, 0.3)', 
                        borderRadius: '99px', marginBottom: '1.5rem',
                        color: '#10b981', fontSize: '0.875rem', letterSpacing: '1px'
                    }}>
                        AVAILABLE FOR HIRE
                    </div>
                    <h1>Hi, I'm <span className="text-gradient">{PORTFOLIO_DATA.name}</span></h1>
                    <p style={{ fontSize: '1.25rem', maxWidth: '600px', margin: '0 auto 2.5rem' }}>
                        {PORTFOLIO_DATA.title} based in {PORTFOLIO_DATA.location}. 
                        Building robust applications with React & Python.
                    </p>
                    <div className="flex justify-center gap-4" style={{ flexWrap: 'wrap' }}>
                        <a href="#projects" className="btn btn-primary">View Work</a>
                        <a href={`mailto:${PORTFOLIO_DATA.email}`} className="btn btn-secondary">
                            <Icon name="mail" size={18} /> Contact Me
                        </a>
                    </div>
                </div>
            </section>
        );

        const SkillCard = ({ skill }) => (
            <div className="card">
                <div className="flex justify-between items-center" style={{ marginBottom: '1rem' }}>
                    <div className="flex items-center gap-4">
                        <div style={{ padding: '0.5rem', background: 'rgba(255,255,255,0.05)', borderRadius: '0.5rem', color: '#10b981' }}>
                            <Icon name={skill.icon} />
                        </div>
                        <span style={{ fontWeight: '600', fontSize: '1.1rem' }}>{skill.name}</span>
                    </div>
                    <span style={{ color: '#94a3b8', fontFamily: 'monospace' }}>{skill.level}%</span>
                </div>
                <div className="skill-track">
                    <div className="skill-fill" style={{ width: `${skill.level}%` }}></div>
                </div>
            </div>
        );

        const ProjectCard = ({ project }) => (
            <div className="card project-card">
                <div className="project-img">
                    <Icon name="code" size={48} style={{ opacity: 0.2 }} />
                    <span style={{ 
                        position: 'absolute', bottom: '1rem', left: '1rem', 
                        background: 'rgba(15, 23, 42, 0.8)', color: '#10b981', 
                        padding: '0.25rem 0.75rem', borderRadius: '0.25rem', fontSize: '0.75rem', border: '1px solid rgba(16, 185, 129, 0.3)'
                    }}>
                        {project.period}
                    </span>
                </div>
                <div className="project-content">
                    <h3>{project.title}</h3>
                    <p>{project.description}</p>
                    <div style={{ marginTop: 'auto' }}>
                        {project.tags.map(tag => <span key={tag} className="tag">{tag}</span>)}
                    </div>
                </div>
            </div>
        );

        // --- ANIMATION COMPONENT ---
        const RevealOnScroll = ({ children, delay = 0 }) => {
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                            observer.unobserve(entry.target);
                        }
                    },
                    { threshold: 0.1 } // 10% visibility triggers animation
                );
                if (ref.current) observer.observe(ref.current);
                return () => { if (ref.current) observer.unobserve(ref.current); };
            }, []);

            return (
                <div ref={ref} className={`reveal-up ${isVisible ? 'visible' : ''}`} style={{ transitionDelay: `${delay}ms` }}>
                    {children}
                </div>
            );
        };

        // --- MAIN APP ---
        const App = () => {
            const [scrollY, setScrollY] = useState(0);
            useEffect(() => {
                const handleScroll = () => requestAnimationFrame(() => setScrollY(window.scrollY));
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            return (
                <div>
                    <ParallaxBackground scrollY={scrollY} />
                    <Nav />
                    
                    <RevealOnScroll>
                        <Hero />
                    </RevealOnScroll>

                    <section id="about" className="section">
                        <div className="container">
                            <RevealOnScroll>
                                <div className="card">
                                    <h2 className="text-center">About Me</h2>
                                    <p className="text-center" style={{ fontSize: '1.1rem', maxWidth: '800px', margin: '0 auto' }}>
                                        {PORTFOLIO_DATA.summary}
                                    </p>
                                </div>
                            </RevealOnScroll>
                        </div>
                    </section>

                    <section id="skills" className="section">
                        <div className="container">
                            <RevealOnScroll>
                                <h2 className="text-center">Technical <span className="text-accent">Arsenal</span></h2>
                            </RevealOnScroll>
                            <div className="grid grid-3">
                                {PORTFOLIO_DATA.skills.map((s, i) => (
                                    <RevealOnScroll key={s.name} delay={i * 100}>
                                        <SkillCard skill={s} />
                                    </RevealOnScroll>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="projects" className="section">
                        <div className="container">
                            <RevealOnScroll>
                                <h2 className="text-center">Featured <span className="text-accent">Projects</span></h2>
                            </RevealOnScroll>
                            <div className="grid grid-2">
                                {PORTFOLIO_DATA.experience.map((p, i) => (
                                    <RevealOnScroll key={i} delay={i * 150}>
                                        <ProjectCard project={p} />
                                    </RevealOnScroll>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="education" className="section">
                        <div className="container" style={{ maxWidth: '800px' }}>
                            <RevealOnScroll>
                                <h2 className="text-center">Education <span className="text-accent">Journey</span></h2>
                            </RevealOnScroll>
                            <div>
                                {PORTFOLIO_DATA.education.map((edu, i) => (
                                    <RevealOnScroll key={i} delay={i * 150}>
                                        <div className="timeline-item">
                                            <div className="timeline-dot"></div>
                                            <span className="timeline-date">{edu.year}</span>
                                            <div className="card" style={{ padding: '1rem' }}>
                                                <h3>{edu.degree}</h3>
                                                <div className="text-accent">{edu.school}</div>
                                            </div>
                                        </div>
                                    </RevealOnScroll>
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="contact" className="section text-center" style={{ marginBottom: '4rem' }}>
                        <div className="container">
                            <RevealOnScroll>
                                <h2>Let's Work Together</h2>
                                <div className="flex justify-center gap-4" style={{ flexWrap: 'wrap' }}>
                                    <a href={`mailto:${PORTFOLIO_DATA.email}`} className="btn btn-primary">
                                        <Icon name="mail" size={20} /> Send Email
                                    </a>
                                    <a href={`tel:${PORTFOLIO_DATA.phone}`} className="btn btn-secondary">
                                        <Icon name="phone" size={20} /> {PORTFOLIO_DATA.phone}
                                    </a>
                                </div>
                                <div className="flex justify-center gap-4" style={{ marginTop: '2rem' }}>
                                    <a href="#" className="text-accent">
                                        <Icon name="github" size={24} />
                                    </a>
                                    <a href="#" className="text-accent">

                                    </a>
                                </div>
                                <div style={{ marginTop: '4rem', color: '#64748b', fontSize: '0.875rem' }}>

                                </div>
                            </RevealOnScroll>
                        </div>
                    </section>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
